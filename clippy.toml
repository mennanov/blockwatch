# The integration tests run inside this repository, so a run would read its blockwatch.toml, which
# skips tests/testdata.
disallowed-macros = [
    { path = "assert_cmd::cargo_bin_cmd", reason = "use common::cargo_bin_cmd!, which passes an empty config" },
]
# globset drops an empty alternative in braces by default, so `{,sub/}a.yml` would not match
# `a.yml`.
disallowed-methods = [
    { path = "globset::Glob::new", reason = "use fs::glob::glob_builder, which keeps an empty alternative" },
    { path = "globset::GlobBuilder::new", reason = "use fs::glob::glob_builder, which keeps an empty alternative" },
]
# `unwrap_used` is for the code that ships. A test that unwraps a bad value fails, which is what it should do.
allow-unwrap-in-tests = true
# `doc_markdown` would want backticks around these. The `".."` keeps clippy's own list.
doc-valid-idents = ["CMake", "CommonMark", "MakeMaker", "OpenAI", ".."]
