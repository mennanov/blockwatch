- id: blockwatch
  name: blockwatch
  description: Validate every <block> rule in the repository, and enforce `affects` on the staged changes.
  # The diff is saved first, so that a failing `git diff` fails the hook. The hook's `args` reach blockwatch through
  # "$@". The trailing `--` is necessary: `bash -c SCRIPT ARG` binds ARG to $0 rather than $1. The sentinel takes the
  # $0 slot instead.
  entry: bash -c 'diff=$(git diff --cached --patch --unified=0) || exit; printf "%s\n" "$diff" | blockwatch --diff "$@"' --
  # pre-commit installs the root setup.py, which pulls a prebuilt blockwatch from PyPI.
  # `language: rust` would compile blockwatch on each user's machine instead.
  language: python
  pass_filenames: false
  stages: [ pre-commit ]

- id: blockwatch-commit-msg
  name: blockwatch (commit-msg)
  description: Validate every <block> rule in the repository, enforce `affects` on the staged changes, and read blockwatch-suppress trailers from the commit message.
  # The same command as the `blockwatch` hook, plus `--suppress-from`. pre-commit appends the message file after the
  # hook's `args`. So `${!#}`, the last argument, is the message file, and the arguments before it go to blockwatch.
  entry: bash -c 'msg=${!#}; set -- "${@:1:$#-1}"; diff=$(git diff --cached --patch --unified=0) || exit; printf "%s\n" "$diff" | blockwatch --diff --suppress-from "$msg" "$@"' --
  language: python
  pass_filenames: true
  stages: [ commit-msg ]
