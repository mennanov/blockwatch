# The test fixtures break the rules on purpose.
ignore = ['tests/testdata/**']

# This block runs on a schedule in .github/workflows/trusted-checks.yml as it needs network access and ideally should
# be avoided in a precommit hook.
skip-blocks = ['src/validators/check_ai.rs:latest-model']

# A block listed in `skip-blocks` is checked only by the scheduled run, so that run must list it too.
[[block]]
target = 'blockwatch.toml#/skip-blocks'
same-as = '.github/workflows/trusted-checks.yml#/jobs/blockwatch/steps/0/with/only_blocks'
same-as-pattern = '(?P<value>[\w./-]+\.\w+:[\w-]+)'

# Users copy the version from the docs, and the pre-commit hooks install the PyPI package that setup.py pins. So each
# copy must be the version being released. `cargo release` rewrites them with the replacements in release.toml.
# The SARIF example also holds the version of the SARIF format, so the version only has to be one of its values.
[[block]]
target = 'Cargo.toml#/package/version'
same-as = '''README.md:pre-commit-rev,
    docs/ci.md:pre-commit-rev,
    docs/ci.md:commit-msg-rev,
    docs/cli.md:sarif-example,
    setup.py:blockwatch-cli-version'''
same-as-mode = 'subset'

# The pattern skips the lines that are not a dependency, such as a comment or the items of a `features` list.
[[block]]
target = 'Cargo.toml#/dependencies'
keep-sorted = true
keep-sorted-pattern = '^(?P<value>[\w-]+) = '

# The docs and the website show the same major version of the GitHub Action. A new major version must reach all of
# them.
[[block]]
target = 'README.md'
target-pattern = 'mennanov/blockwatch-action@(?P<value>v\d+)'
same-as = '''docs/ci.md,
    site/src/pages/index.astro,
    src/skill.md'''
# The pattern reads both the target's value, `v1`, and each `mennanov/blockwatch-action@v1` in the other files.
same-as-pattern = '(?:mennanov/blockwatch-action@|^)(?P<value>v\d+)\b'

# Dependabot updates these actions in the workflows and in actions.lock, but not these pins, which dist copies into
# release.yml. Each pattern reads both the pin, such as `v7.0.1`, and the tag after each use of the action. The
# lockfile lists that tag once for each workflow that uses the action, so every workflow must use the pinned tag.
# A forgotten `dist generate` leaves the old tag in release.yml, and a forgotten `gh actions-lock` leaves it in the
# lockfile. Either one fails here.
[[block]]
target = 'dist-workspace.toml#/dist/github-action-commits/actions~1checkout'
same-as = '''.github/workflows/actions.lock,
    .github/workflows/release.yml'''
same-as-pattern = '(?:actions/checkout@|^)(?P<value>v\d+(?:\.\d+)*)\b'

[[block]]
target = 'dist-workspace.toml#/dist/github-action-commits/actions~1upload-artifact'
same-as = '''.github/workflows/actions.lock,
    .github/workflows/release.yml'''
same-as-pattern = '(?:actions/upload-artifact@|^)(?P<value>v\d+(?:\.\d+)*)\b'

[[block]]
target = 'dist-workspace.toml#/dist/github-action-commits/actions~1download-artifact'
same-as = '''.github/workflows/actions.lock,
    .github/workflows/release.yml'''
same-as-pattern = '(?:actions/download-artifact@|^)(?P<value>v\d+(?:\.\d+)*)\b'

[[block]]
target = 'dist-workspace.toml#/dist/github-action-commits/actions~1attest'
same-as = '''.github/workflows/actions.lock,
    .github/workflows/release.yml'''
same-as-pattern = '(?:actions/attest@|^)(?P<value>v\d+(?:\.\d+)*)\b'

# SECURITY.md shows the public key that signs the release archives, for people who check a download by hand. A new
# key must reach it.
[[block]]
target = 'Cargo.toml#/package/metadata/binstall/signing/pubkey'
same-as = 'SECURITY.md'
same-as-pattern = '\b(?P<value>RW[A-Za-z0-9+/]{54})\b'

# `blockwatch skill` prints src/skill.md, and some projects hold a saved copy of that output. A tag in that file would
# become a block in every one of those projects. So the skill's rules live in the entries below, and blocks point at
# its sections by their headings.
# An agent loads the whole skill into its context each time it uses it, so the skill must stay short.
[[block]]
target = 'src/skill.md'
name = 'skill-line-count'
line-count = '<=250'

# The skill and docs/symbols.md both list the languages whose types have member symbols.
[[block]]
target = 'src/skill.md'
target-pattern = 'are symbols too, under the type.s name, in (?P<value>[^.]+)\.'
name = 'skill-languages-with-members'
same-as = 'docs/symbols.md:languages-with-members'
same-as-pattern = '[\w#]+'

[[block]]
target = 'docs/symbols.md'
target-pattern = 'In (?P<value>Java[^.]+), the members of a type are symbols too'
name = 'languages-with-members'
same-as-pattern = '[\w#]+'

[[block]]
target = 'src/skill.md#/blockwatch/Where blocks add value'
name = 'where-blocks-add-value'
same-as = 'src/validators/mod.rs:validator-registry'
same-as-format = 'identifier'
same-as-pattern = '^\|\s*[^|]+\|\s*`(?P<value>[a-z-]+)`\s*\|'

[[block]]
target = 'src/skill.md#/blockwatch/Validator reference'
name = 'validator-reference'
same-as-pattern = '^\|\s*`(?P<value>[a-z-]+)`'

[[block]]
target = 'src/skill.md#/blockwatch/Symbols/Files with symbols'
name = 'languages-with-symbols'
same-as-pattern = '`(?P<value>[^`]+)`'

[[block]]
target = 'src/skill.md#/blockwatch/Config file/Project settings'
name = 'skill-config-keys'
same-as = 'src/config.rs:config-keys'
same-as-format = 'identifier'
same-as-pattern = '^\|\s*`(?P<value>[a-z-]+)`'
