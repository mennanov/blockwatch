[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build each package with `-p <name>` instead of `--workspace`, so the `fuzz`
# member (which only links under `cargo afl build`) stays out of release builds.
precise-builds = true
# A GitHub repo to push Homebrew formulas to
tap = "mennanov/homebrew-blockwatch"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# TEMPORARY: build the artifacts on pull requests, to test the manylinux container.
pr-run-mode = "upload"

[dist.github-custom-runners]
global = "ubuntu-latest"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-14"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-latest"
# A binary needs the glibc it was built with, or a newer one, to start. ubuntu-latest
# has a new glibc, so a binary built there fails on distributions like Ubuntu 22.04.
# This image has glibc 2.28, so the binary also runs on RHEL 8 and Ubuntu 20.04.
# The installer checks the same version. dist assumes a container is musl unless
# `host` says otherwise.
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-gnu" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-latest"

# dist defaults to actions/checkout@v6; pin v7 to match rust.yml and codeql.yml.
# The other actions come from dist's defaults, which are already on Node 24.
[dist.github-action-commits]
"actions/checkout" = "v7"
