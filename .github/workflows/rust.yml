name: Rust

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview, clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Check the doc comments
        # Nearly every item is private, so without the flag rustdoc would skip their docs.
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # `cargo llvm-cov` below does not run doctests.
      - name: Run doctests
        run: cargo test --doc
      - name: Run tests
        run: cargo llvm-cov --lcov --output-path coverage.lcov
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
