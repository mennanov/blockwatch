name: blockwatch

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  blockwatch:
    runs-on: ubuntu-latest
    env:
      # A run is "trusted" when it is a push (which requires write access) or a pull request whose
      # branch lives in this repository (i.e. not a fork). Only trusted runs receive the API key.
      TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: mennanov/blockwatch-action@v1
        env:
          # Untrusted (fork) PRs are still linted, but without any secrets.
          BLOCKWATCH_AI_API_KEY: ${{ env.TRUSTED == 'true' && secrets.BLOCKWATCH_AI_API_KEY || '' }}
