name: trusted checks

# Runs the checks that only a trusted run may do. They need the network and
# `BLOCKWATCH_LUA_MODE=safe`. Lua scripts come from the scanned files, so a pull request from a fork
# must not run them in `safe` mode. A scheduled run uses the default branch, so it is trusted.
#
# It runs on a schedule, not on trusted pull requests, because a result can change without a commit.
# When a new nano model ships, every pull request would fail, even one that doesn't touch the model.
#
# The job picks the checks by validator. Every check-lua block in this repository needs the network,
# so the job runs check-lua, and blockwatch.yml leaves it out.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blockwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: mennanov/blockwatch-action@v1
        env:
          BLOCKWATCH_LUA_MODE: safe
        with:
          enable: check-lua
          ignore: "tests/testdata/**"
