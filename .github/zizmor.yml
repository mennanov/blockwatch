rules:
  unpinned-images:
    ignore:
      # Generated by dist. Change dist-workspace.toml and run `dist generate`, not this file.
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
  self-repository:
    ignore:
      - release.yml
