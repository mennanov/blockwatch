version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "monthly"
    # A release must be a week old before Dependabot proposes it, so a hijacked release is
    # likely to be pulled before it reaches this repository.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
