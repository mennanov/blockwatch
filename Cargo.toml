[package]
name = "blockwatch"
version = "0.22.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/mennanov/blockwatch"
description = "Language agnostic linter that keeps your code and documentation in sync and valid"
homepage = "https://blockwatch.sh"
license = "MIT"
keywords = ["linter", "sync", "drift", "comments", "agents"]
categories = ["development-tools", "command-line-utilities"]
# The website is built and hosted on its own; the crate doesn't need it.
exclude = ["site/"]

# `cargo binstall` checks each release archive against this key. The release workflow signs the archives with the
# secret half. A version published with a key that didn't sign its archives can't be installed with binstall.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQAy2A3WWnUR2c5oDQ343TyWusiMS1fWYC5G6bufHV7GbByRW0DQf9i"

[workspace]
members = ["fuzz"]
# Only build/test the blockwatch crate by default. The `fuzz` member (and its
# heavy `afl` dependency) is opt-in via `-p fuzz` / `--workspace`, so plain
# `cargo build` and `cargo test` never compile it.
default-members = ["."]

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.43.0", features = [
    "completion-types",
    "chat-completion",
] }
async-trait = "0.1"
bigdecimal = "0.4"
clap = { version = "4.6", features = ["cargo", "derive"] }
cssparser = "0.38.0"
fnv = "1.0"
globset = "0.4.18"
heck = "0.5"
ignore = "0.4"
# Pinned exactly: a new version can change which symbols and comments a Makefile has.
makefile-lossless = "=0.4.8"
markdown = "1.0.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "async", "send"] }
percent-encoding = "2.3"
regex = "1.12"
secrecy = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
serde_spanned = "1.1"
similar = { version = "3.1" }
strsim = "0.11"
strum = "0.28"
strum_macros = "0.28"
tokio = { version = "1.52", features = ["full"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
# The grammar crates the language parsers are built from.
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7.4"
tree-sitter-containerfile = "0.9"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.3.0"
tree-sitter-groovy = "0.1"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-nix = "0.3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.25"
tree-sitter-prisma = "0.2.2"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3.0"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
unidiff = "0.4.1"
winnow = "1.0"

[dev-dependencies]
assert-json-diff = "2.0.2"
assert_cmd = "2.2"
axum = "0.8"
libc = "0.2"
predicates = "3.1"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# A match on an enum must list every variant (AGENTS.md). These two turn such a match into `if let` or let-else.
single_match_else = "allow"
manual_let_else = "allow"
# Comes from dependencies, which pull in two versions of some crates.
multiple_crate_versions = "allow"
# The symbol tests put every shape in one fixture on purpose, so they are long.
too_many_lines = "allow"
# Flags pairs such as `block` and `blocks`. Renaming them would make the names worse.
similar_names = "allow"
# Flags fields such as `open_blocks` in `Blocks`. Each name says what the field holds. Without the struct's name, it
# would say less.
struct_field_names = "allow"
# A module with child modules keeps its own code in `mod.rs`, inside its folder, so each such module looks the same.
self_named_module_files = "warn"
# A `_` arm gives a variant added later whatever that arm does, without anyone deciding it. So each `_` on an enum
# needs an `expect` that says why no new variant could need another arm.
wildcard_enum_match_arm = "warn"
# Restriction lints, one by one. The whole group doesn't fit.
# AGENTS.md asks for a reason on each `expect`.
allow_attributes_without_reason = "warn"
# `#[expect]` fails once its lint stops firing. `#[allow]` goes stale without a word.
allow_attributes = "warn"
# stdout carries the JSON and SARIF output. A stray `println!` breaks it.
print_stdout = "warn"
print_stderr = "warn"
# Leftovers from debugging.
dbg_macro = "warn"
todo = "warn"
# `process::exit` skips destructors and buffered writes.
exit = "warn"
# Test names follow `state_action_expected_result`, with no `test_` prefix.
redundant_test_prefix = "warn"
# Tests must run the code that ships.
cfg_not_test = "warn"
# Each panic must say why it can't happen. `allow-unwrap-in-tests` in `clippy.toml` lets tests unwrap.
unwrap_used = "warn"
# Hash order changes between runs. Output must not.
iter_over_hash_type = "warn"
# `|_|` drops the cause of the error.
map_err_ignore = "warn"
# An `unsafe` block says why it is sound.
undocumented_unsafe_blocks = "warn"
# An ignored `Result` must be on purpose.
let_underscore_must_use = "warn"
# `.ok()` hides that a `Result` is thrown away.
unused_result_ok = "warn"
# A failed assert says what broke.
missing_assert_message = "warn"
# One way to join strings.
string_add = "warn"
# Keeps `pub(super)` and never `pub(in super)`.
pub_without_shorthand = "warn"
# Nursery lints, one by one. The group has wrong hits, and lints that go against AGENTS.md.
# `peekable` with no `peek` is dead code.
unused_peekable = "warn"
# Threads share the parsers behind a `Mutex`. Holding a lock longer than needed makes them wait.
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
# Pushing an absolute path onto a `PathBuf` replaces the whole path.
path_buf_push_overwrite = "warn"
# These catch dead code, or code that asks for more than it needs.
collection_is_never_read = "warn"
needless_pass_by_ref_mut = "warn"
derive_partial_eq_without_eq = "warn"
trait_duplication_in_bounds = "warn"
# `unwrap_or(f())` runs `f` even when the value is there.
or_fun_call = "warn"
# AGENTS.md asks for short sentences.
too_long_first_doc_paragraph = "warn"
# One name for the type inside its own `impl`.
use_self = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
