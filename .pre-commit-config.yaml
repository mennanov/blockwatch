default_install_hook_types: [ pre-commit, commit-msg ]
repos:
  - repo: local
    hooks:
      - id: blockwatch
        name: blockwatch
        # This repository develops blockwatch, so its own hook runs the working tree's build rather
        # than whatever release happens to sit on PATH. A published binary predates the flags and
        # rules being worked on here, which makes it both reject valid invocations and pass changes
        # it does not yet know how to check. `.pre-commit-hooks.yaml` is the hook other repositories
        # consume; that one deliberately stays on a built release.
        #
        # It runs at commit-msg rather than pre-commit so that a `Blockwatch-suppress:` trailer in
        # the message being written is read. The trailing `--` is necessary: pre-commit appends
        # the message file to this argv, and `bash -c SCRIPT FILE` binds FILE to $0 rather than $1.
        entry: bash -c 'set -o pipefail; git diff --patch --cached --unified=0 | cargo run --quiet -- --diff --only-changed --ignore="tests/testdata/**" --suppress-from "$1"' --
        language: system
        stages: [ commit-msg ]
        pass_filenames: true
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code using cargo fmt.
        entry: cargo fmt --check
        language: system
        types: [ rust ]
        stages: [ pre-commit ]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code using cargo clippy.
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [ rust ]
        stages: [ pre-commit ]
        pass_filenames: false
